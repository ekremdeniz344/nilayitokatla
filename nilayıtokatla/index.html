<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Nilay'ı Tokatla</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      background-color: #fff;
    }
    h1 {
      margin-top: 30px;
    }
    #nilay {
      width: 300px;
      margin-top: 30px;
    }
    button {
      margin-top: 30px;
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
      background-color: red;
      color: white;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>Nilay'ı Tokatla 👋</h1>
  <img id="nilay" src="WhatsApp Görsel 2025-04-13 saat 00.03.25_e96177a0.jpg" alt="Nilay">
  <br>
  <button onclick="tokatla()">Tokatla!</button>

  <audio id="slapSound" src="WhatsApp Ses 2025-04-13 saat 00.03.14_85822b8d.mp3"></audio>

  <script>
    function tokatla() {
      const img = document.getElementById("nilay");
      const sound = document.getElementById("slapSound");

      img.src = "nilay.gif";
      sound.currentTime = 0;
      sound.play();

      setTimeout(() => {
        img.src = "WhatsApp Görsel 2025-04-13 saat 00.03.25_e96177a0.jpg";
      }, 1500);
    }
  </script>
</body>
</html>
